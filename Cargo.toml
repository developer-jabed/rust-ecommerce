[package]
name = "ecommerce-api"
version = "0.2.0"
edition = "2021"
authors = ["Staff Backend Engineer"]
description = "Production-ready e-commerce API built with Rust, Axum, SQLx and PostgreSQL"
license = "MIT"

[dependencies]
# Web framework – pinned for Rust 1.75 compatibility
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header", "cookie"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "timeout", "limit"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & security
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config & env
dotenvy = "0.15"
config = "0.14"

# Validation & errors
validator = { version = "0.16", features = ["derive"] }
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
once_cell = "1"
futures = "0.3"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"